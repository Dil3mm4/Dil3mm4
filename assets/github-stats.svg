    <stop offset="0" stop-color="#6DE4D7"/>
    <stop offset="1" stop-color="#91AFFF"/>
  </linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#6DE4D7" stop-opacity=".12"/>
    <stop offset="1" stop-color="#6DE4D7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="mesh" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#B3CADC" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
</defs>
